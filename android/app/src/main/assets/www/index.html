<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Glacier Launcher</title>
    <!-- Same stylesheet as the desktop app's wwwroot/css/app.css, byte for byte. -->
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <style>
        /* Same reset the desktop shell's index.html applies inline. */
        html, body, #app { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        /* Android has no window chrome to drag/resize — the desktop .top-bar's
           drag-zone and window-control buttons (minimize/maximize/close) are
           genuinely inapplicable here and are the only intentional omission
           from .top-bar's real markup. Everything else below is unmodified. */
    </style>
</head>
<body>
    <div id="app">
        <div class="window">
            <div class="window-bg" style="background-image:url('images/bg.jpg')"></div>

            <!-- ── TOP BAR ── (real markup from Pages/Home.razor's <div class="top-bar">) -->
            <div class="top-bar">
                <div class="branding">
                    <img class="logo-icon" src="images/icon.png" alt="" />
                    <div class="branding-text">
                        <span class="branding-title">Glacier Launcher</span>
                        <span class="branding-sub">Glacier Productions</span>
                    </div>
                    <button class="update-pill"><span id="version-pill">v0.0.0-dev</span></button>
                </div>
                <div class="top-bar-spacer"></div>
                <div class="edition-switcher" data-tooltip="Switch Minecraft edition">
                    <button class="edition-tab active" id="edition-bedrock" data-edition="bedrock">
                        <i class="fa-solid fa-cube"></i><span>Bedrock</span>
                    </button>
                    <button class="edition-tab" id="edition-java" data-edition="java">
                        <i class="fa-brands fa-java"></i><span>Java</span>
                    </button>
                </div>
                <div class="topbar-client-chip" id="client-chip" data-tooltip="Click to cycle client">
                    <div class="chip-dot"></div>
                    <i class="chip-icon fa-solid fa-cube"></i>
                    <span id="client-chip-label">Latite Client</span>
                    <i class="fa-solid fa-chevron-right chip-arrow"></i>
                </div>
            </div>

            <!-- ── MAIN CONTENT ── (real markup: .main-content > .btn-row quick actions) -->
            <div class="main-content" id="main-content">
                <div class="btn-row" id="quick-actions"></div>

                <div id="home-view">
                    <p class="status-msg" id="status-msg"></p>
                    <div class="recently-launched" id="recently-launched" style="display:none;">
                        <span class="recently-label">Recent:</span>
                        <div id="recently-launched-items"></div>
                    </div>
                </div>
            </div>

            <!-- ── FOOTER ── (real markup from Pages/Home.razor's <div class="footer">) -->
            <div class="footer">
                <div class="footer-profile-area" id="footer-profile">
                    <img class="avatar" src="images/icon.png" alt="" />
                    <div class="user-info">
                        <span class="username" id="footer-username">Not signed in</span>
                        <span class="user-handle" id="footer-handle">Local profile</span>
                    </div>
                    <button class="profile-switch-btn" id="rpc-toggle" data-tooltip="Toggle Discord RPC">
                        <i class="fa-brands fa-discord"></i>
                    </button>
                </div>
                <div class="footer-right">
                    <button class="xbox-connect-btn" id="xbox-connect-btn">
                        <i class="fa-solid fa-gamepad"></i> Xbox
                    </button>
                    <button class="discord-connect-btn" id="discord-connect-btn">
                        <i class="fa-brands fa-discord"></i> Connect
                    </button>
                    <span style="font-size:11px; color:var(--text-dim);">
                        <i class="fa-solid fa-clock" style="margin-right:4px;"></i>
                        <span id="footer-version">Glacier Launcher for Android</span>
                    </span>
                </div>
            </div>

            <!-- News ticker -->
            <div class="news-strip">
                <div class="news-track" id="news-track"></div>
            </div>

            <!-- Panels are injected here as fresh DOM nodes so app.css's slideUp
                 keyframe animation (keyed on a .panel-overlay element mounting)
                 replays every time a panel opens, same as Blazor's @if. -->
            <div id="panel-root"></div>
        </div>
    </div>

    <script src="js/bridge.js"></script>
    <script src="js/curseforge.js"></script>
    <script src="js/modrinth.js"></script>
    <script src="js/javaedition.js"></script>
    <script src="js/levilamina.js"></script>
    <script src="js/skinlibrary.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# app_pojavlauncher (the merged-in Java Edition runtime, see android/README.md)
# was written expecting a non-transitive-R-class-off, final-res-ids build (its
# own now-bypassed root build.gradle set both to false) — with them on
# (AGP 8's default, and what :app itself was relying on) its library R class
# stops re-exporting resource IDs from its own dependencies (portrait-sdp,
# constraintlayout, etc: "cannot find symbol" on R.dimen._20sdp and similar)
# and its resource IDs stop being compile-time constants (breaks `case
# R.id.foo:` in switch statements: "constant expression required"). Building
# the whole Gradle run with both off matches Pojav's own convention and is a
# no-op for :app, which never relied on either being on.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
kotlin.code.style=official

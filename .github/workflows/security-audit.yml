name: Security audit

# Catches known-vulnerable dependencies before they ship — cargo/npm audit
# don't run as part of ci.yml (that's build correctness, this is advisory
# security), and dependency advisories land on their own schedule
# independent of when code actually changes here.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # High/critical only — low/moderate advisories in transitive
      # dev-dependencies are too noisy to gate a build on.
      - run: npm audit --audit-level=high

name: Security audit

# Catches known-vulnerable dependencies before they ship — cargo/npm audit
# don't run as part of ci.yml (that's build correctness, this is advisory
# security), and dependency advisories land on their own schedule
# independent of when code actually changes here.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prebuilt binary: seconds instead of ~3 minutes compiling it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Restore node_modules itself (keyed on the lockfile) so npm ci only
      # runs when dependencies actually change.
      - id: nm
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      # High/critical only — low/moderate advisories in transitive
      # dev-dependencies are too noisy to gate a build on.
      - run: npm audit --audit-level=high

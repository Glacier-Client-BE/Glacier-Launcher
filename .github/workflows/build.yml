name: Build

# Produces the actual installable app (exe + NSIS/MSI bundles) — ci.yml only
# lints/tests. Manually triggerable for a one-off build, and runs
# automatically on version tags so a `git tag vX.Y.Z && git push --tags`
# publishes artifacts without a local build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'video/**', 'graphify-out/**', '.github/dependabot.yml']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Release rules (same as the C# launcher): a push to main whose commit
      # message starts with "update:" bumps the middle number (2.0.0 -> 2.1.0),
      # "hotfix:" bumps the last (2.0.0 -> 2.0.1). Anything else just builds.
      # The Rust rewrite starts its own line at 2.0.0.
      - name: Determine release version
        id: ver
        shell: pwsh
        run: |
          $msg = git log -1 --pretty=%s
          $release = "${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main" -and $msg -match '^(update|hotfix):'
          if ($release -and (git tag --points-at HEAD)) { Write-Host "HEAD already released"; $release = $false }
          if (-not $release) { "release=false" >> $env:GITHUB_OUTPUT; exit 0 }
          $tags = @(git tag -l "v*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]($_.TrimStart('v')) })
          $v = if ($tags.Count) { [version]$tags[-1].TrimStart('v') } else { [version]"0.0.0" }
          if ($v -lt [version]"2.0.0") { $next = "2.0.0" }
          elseif ($msg -match '^hotfix:') { $next = "$($v.Major).$($v.Minor).$($v.Build + 1)" }
          else { $next = "$($v.Major).$($v.Minor + 1).0" }
          Write-Host "Releasing v$next"
          "release=true" >> $env:GITHUB_OUTPUT
          "version=$next" >> $env:GITHUB_OUTPUT

      - name: Stamp version
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version": "[^"]+"', "`"version`": `"$v`"" | Set-Content src-tauri/tauri.conf.json -NoNewline
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]+"', "version = `"$v`"" | Set-Content src-tauri/Cargo.toml -NoNewline

      - uses: dtolnay/rust-toolchain@stable

      # Caches the Cargo registry, git deps, and `target/` keyed on
      # Cargo.lock — this is what turns a ~40 minute cold `cargo build` into
      # a couple of minutes when only a few crates actually changed.
      - uses: Swatinem/rust-cache@v2
        with:
          # This workflow only runs on tags/workflow_dispatch (rarely), so
          # cache churn isn't a concern — always saving means the *next*
          # manual build on a feature branch is warm too, not just main's.
          shared-key: release
          save-if: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Restore node_modules itself (keyed on the lockfile) so npm ci only
      # runs when dependencies actually change.
      - id: nm
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      # Tauri downloads NSIS + its plugin into LOCALAPPDATA/tauri on every
      # bundle; keep them between runs.
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      - name: Build (frontend + Tauri release bundle)
        run: npm run build
        env:
          GLACIER_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: glacier-launcher-windows
          path: |
            target/release/glacier-launcher.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Only the setup .exe goes on the release: the in-app updater installs
      # the first .exe asset of the newest release.
      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Glacier Launcher v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: target/release/bundle/nsis/*-setup.exe

      - name: Notify website
        if: steps.ver.outputs.release == 'true'
        continue-on-error: true
        run: gh api repos/Glacier-Client-BE/Glacier-Website/dispatches -f event_type=launcher-release
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

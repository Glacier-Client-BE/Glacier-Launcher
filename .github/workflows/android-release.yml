name: Android Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine Next Version
        id: versioning
        shell: bash
        run: |
          # PR builds (and manual runs off a non-main ref) just build + upload
          # artifacts for review — no tagging or releasing off a PR head.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_OUTPUT"
            echo "NEXT_VERSION=pr-${{ github.event.pull_request.number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "Building PR #${{ github.event.pull_request.number }} — no release."
            exit 0
          fi

          # The comment above says manual runs off a non-main ref only build,
          # but nothing actually enforced it: workflow_dispatch on any branch
          # fell through to the tagging logic below, so a branch whose HEAD
          # commit happened to start with "hotfix:"/"update:" would cut a real
          # tag and GitHub Release straight off that branch. Releases come
          # from main only.
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_OUTPUT"
            echo "NEXT_VERSION=branch-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "Manual run off ${{ github.ref }} — build only, no release."
            exit 0
          fi

          # Same scheme as the desktop launcher's release workflow:
          # "hotfix:" bumps patch, "update:" bumps minor, anything else -> just build (no release).
          existing_tag=$(git tag --points-at HEAD | grep '^android-v' | head -n1 || true)
          if [ -n "$existing_tag" ]; then
            echo "HEAD already released as $existing_tag — skipping."
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'android-v*' | sed 's/android-v//' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS='.' read -r major minor patch <<< "$latest"
            msg=$(git log -1 --pretty=%s)
            if [[ "$msg" == hotfix:* ]]; then
              next="$major.$minor.$((patch + 1))"
            elif [[ "$msg" == update:* ]]; then
              next="$major.$((minor + 1)).0"
            else
              echo "Commit message does not start with 'hotfix:' or 'update:' — build only, no release."
              echo "SKIP_RELEASE=true" >> "$GITHUB_OUTPUT"
              next="$major.$minor.$patch-dev"
            fi
          fi
          echo "NEXT_TAG=android-v$next" >> "$GITHUB_OUTPUT"
          echo "NEXT_VERSION=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Set up JDK 17
        if: steps.versioning.outputs.SKIP != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        if: steps.versioning.outputs.SKIP != 'true'
        uses: android-actions/setup-android@v3

      # android-actions/setup-android provisions the SDK platform/build-tools
      # but not the NDK app_pojavlauncher's native build needs — AGP resolves
      # and downloads that itself the first time a build actually touches it
      # (~10s, every run, with nothing here to key it against explicitly
      # since no build file pins an ndkVersion — it's whatever AGP/Pojav's
      # own native build resolves). Keyed on a hash of the Gradle build files
      # so a change to the dependency graph (which could shift the resolved
      # NDK version) invalidates the cache instead of silently keeping a
      # stale one; restore-keys falls back to the most recent cache of any
      # hash if there's no exact match, still saving the download even then.
      - name: Cache Android NDK
        if: steps.versioning.outputs.SKIP != 'true'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-${{ runner.os }}-${{ hashFiles('android/**/build.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            ndk-${{ runner.os }}-

      - name: Set up Gradle
        if: steps.versioning.outputs.SKIP != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          # This project has no committed gradlew wrapper (only a stray
          # gradle-wrapper.properties, never wired up), so `gradle` on PATH
          # was always whatever setup-gradle provisions by default — Gradle
          # 9.7.1. That's fine for :app alone, but app_pojavlauncher's own
          # build.gradle (now built in as a library — see android/README.md)
          # uses the imperative `exec { ... }` API on Project, which Gradle
          # 9 removed outright (it was already deprecated, in favor of the
          # ExecOperations service, since 8.x). Pin 8.9 explicitly instead —
          # the same version AGP 8.7.2 requires as a minimum, and old enough
          # that Project.exec() still works.
          gradle-version: '8.9'

      - name: Convert PojavLauncher submodule into a library module
        if: steps.versioning.outputs.SKIP != 'true'
        run: ./scripts/rebrand-pojav.sh

      # `secrets.*` can't be referenced inside `if:`/ternary expressions
      # (GitHub Actions rejects that at workflow-parse time, before any job
      # runs) — so the presence check happens here, in a `run:` env block
      # where secrets are always allowed, and everything downstream branches
      # on this step's plain-string output instead.
      - name: Check for release keystore secret
        if: steps.versioning.outputs.SKIP != 'true'
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Note the unescaped quotes: `$(... [ -n \"$KS_B64\" ] ...)` tested the
        # literal two-character string `""` rather than the variable, which is
        # never empty, so this reported present=true even with no keystore
        # secret set — the decode step below then wrote an empty file and the
        # release build was handed a bogus keystore path. Only :app's own
        # four-way hasSigningConfig check in build.gradle.kts kept that from
        # failing the build outright.
        run: |
          if [ -n "$KS_B64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.versioning.outputs.SKIP != 'true' && steps.keystore.outputs.present == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/glacier-release.keystore"

      # One invocation for both variants, not two: each separate `gradle`
      # process pays JVM startup, project configuration, and dependency
      # resolution again from scratch (`--no-daemon` means nothing carries
      # over in memory between them either way) — real time on every run,
      # not just a first/cold one. A single invocation also lets the Gradle
      # build cache (org.gradle.caching=true, gradle.properties) actually
      # hit within this run: debug and release share most of the same
      # inputs (same sources, same resources), so most of release's tasks
      # become cache hits from debug's run moments earlier instead of
      # rerunning. All the env vars both variants need are passed together;
      # ANDROID_KEYSTORE_PATH etc. are simply unused by :app:assembleDebug.
      - name: Build debug and release APKs
        if: steps.versioning.outputs.SKIP != 'true'
        env:
          GLACIER_VERSION: ${{ steps.versioning.outputs.NEXT_VERSION }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PLAY_LICENSING_PUBLIC_KEY: ${{ secrets.PLAY_LICENSING_PUBLIC_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && format('{0}/glacier-release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload build artifacts
        if: steps.versioning.outputs.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glacier-launcher-android-${{ steps.versioning.outputs.NEXT_VERSION }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      - name: Create and Push Tag
        if: steps.versioning.outputs.SKIP != 'true' && steps.versioning.outputs.SKIP_RELEASE != 'true'
        run: |
          tag="${{ steps.versioning.outputs.NEXT_TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Release
        if: steps.versioning.outputs.SKIP != 'true' && steps.versioning.outputs.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.NEXT_TAG }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Website Repo
        if: steps.versioning.outputs.SKIP != 'true' && steps.versioning.outputs.SKIP_RELEASE != 'true'
        run: |
          gh api repos/Glacier-Client-BE/Glacier-Website/dispatches -f event_type=android-launcher-release
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

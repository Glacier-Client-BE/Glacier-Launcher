name: Android Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine Next Version
        id: versioning
        shell: bash
        run: |
          # PR builds (and manual runs off a non-main ref) just build + upload
          # artifacts for review — no tagging or releasing off a PR head.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_OUTPUT"
            echo "NEXT_VERSION=pr-${{ github.event.pull_request.number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "Building PR #${{ github.event.pull_request.number }} — no release."
            exit 0
          fi

          # Same scheme as the desktop launcher's release workflow:
          # "hotfix:" bumps patch, "update:" bumps minor, anything else -> just build (no release).
          existing_tag=$(git tag --points-at HEAD | grep '^android-v' | head -n1 || true)
          if [ -n "$existing_tag" ]; then
            echo "HEAD already released as $existing_tag — skipping."
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'android-v*' | sed 's/android-v//' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS='.' read -r major minor patch <<< "$latest"
            msg=$(git log -1 --pretty=%s)
            if [[ "$msg" == hotfix:* ]]; then
              next="$major.$minor.$((patch + 1))"
            elif [[ "$msg" == update:* ]]; then
              next="$major.$((minor + 1)).0"
            else
              echo "Commit message does not start with 'hotfix:' or 'update:' — build only, no release."
              echo "SKIP_RELEASE=true" >> "$GITHUB_OUTPUT"
              next="$major.$minor.$patch-dev"
            fi
          fi
          echo "NEXT_TAG=android-v$next" >> "$GITHUB_OUTPUT"
          echo "NEXT_VERSION=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Set up JDK 17
        if: steps.versioning.outputs.SKIP != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        if: steps.versioning.outputs.SKIP != 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.versioning.outputs.SKIP != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: steps.versioning.outputs.SKIP != 'true'
        env:
          GLACIER_VERSION: ${{ steps.versioning.outputs.NEXT_VERSION }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        if: steps.versioning.outputs.SKIP != 'true'
        env:
          GLACIER_VERSION: ${{ steps.versioning.outputs.NEXT_VERSION }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Rebrand PojavLauncher submodule
        if: steps.versioning.outputs.SKIP != 'true'
        run: ./scripts/rebrand-pojav.sh

      - name: Build Java Edition companion APK (rebranded PojavLauncher)
        if: steps.versioning.outputs.SKIP != 'true'
        working-directory: android/pojavlauncher
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleRelease --no-daemon

      - name: Upload build artifacts
        if: steps.versioning.outputs.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glacier-launcher-android-${{ steps.versioning.outputs.NEXT_VERSION }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/pojavlauncher/app_pojavlauncher/build/outputs/apk/**/*.apk

      - name: Create and Push Tag
        if: steps.versioning.outputs.SKIP != 'true' && steps.versioning.outputs.SKIP_RELEASE != 'true'
        run: |
          tag="${{ steps.versioning.outputs.NEXT_TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Release
        if: steps.versioning.outputs.SKIP != 'true' && steps.versioning.outputs.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.NEXT_TAG }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/**/*.apk
            android/pojavlauncher/app_pojavlauncher/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

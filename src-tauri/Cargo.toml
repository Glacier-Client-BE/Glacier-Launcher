[package]
name = "glacier-launcher"
version = "2.0.0"
description = "Glacier Launcher"
authors = ["Glacier Client"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
winreg = "0.55"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio.workspace = true
reqwest.workspace = true
base64 = "0.22"
url = "2"
sha2 = "0.10"
rand = "0.8"

gl-persistence = { path = "../crates/gl-persistence" }
gl-auth = { path = "../crates/gl-auth" }
gl-java = { path = "../crates/gl-java" }
gl-modpack = { path = "../crates/gl-modpack" }
gl-bedrock = { path = "../crates/gl-bedrock" }
gl-nbt = { path = "../crates/gl-nbt" }
gl-injection = { path = "../crates/gl-injection" }
gl-win32chrome = { path = "../crates/gl-win32chrome" }
gl-download = { path = "../crates/gl-download" }
gl-clients = { path = "../crates/gl-clients" }
gl-integrations = { path = "../crates/gl-integrations" }
gl-settings = { path = "../crates/gl-settings" }
gl-update = { path = "../crates/gl-update" }
gl-launch = { path = "../crates/gl-launch" }
gl-sync = { path = "../crates/gl-sync" }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = "2.4.4"
